# ColorSplash XG — Recall preset on scene activation
#
# Native HA scenes capture entity STATE (rgb_color, brightness, etc.)
# but not service calls. When a scene with the pool light activates,
# HA calls `light.turn_on(rgb_color=…)` which routes back through the
# bridge's LUT picker — possibly producing a different recipe than
# the original preset (close color, different show + offset).
#
# This blueprint pairs a HA scene with a saved preset slug so the
# bridge replays the exact recipe (start_byte + wait_ms) on scene
# activation. One automation per (scene, preset) pairing.
#
# See issue #72 for the design context. Path B (a `select` entity
# that scenes capture natively) is tracked in #73 for post-1.0.0.

blueprint:
  name: ColorSplash XG — Recall preset on scene activation
  description: >
    When a specific HA scene is activated, recall a ColorSplash XG
    saved color preset by slug. Use this to bind the bridge's
    exact-recipe replay to a scene without relying on HA's
    rgb_color snapshot (which gets re-LUT'd through the bridge's
    picker and may produce a different recipe).


    Tip: leave the pool light entity OUT of the scene's entity
    list. Otherwise HA will briefly apply the snapshotted rgb_color
    via the LUT picker before this blueprint's recall fires.
  domain: automation
  source_url: https://github.com/swizzlevixen/colorsplash-xg-ha/blob/main/dashboard/blueprints/colorsplash_xg_preset_on_scene.yaml
  input:
    target_scene:
      name: Scene
      description: When this scene activates, recall the preset.
      selector:
        entity:
          filter:
            domain: scene
    preset_slug:
      name: Preset slug
      description: >
        The slug of the saved preset (e.g. "orange",
        "sunset_magenta"). Lowercase a-z, 0-9, underscore or
        hyphen, up to 15 chars. Find it in HA → Developer Tools
        → States → any `sensor.pool_color_preset_*` (each slot's
        JSON includes the slug field), or in the preset card's
        edit modal for that preset.
      selector:
        text:
    recall_delay_ms:
      name: Recall delay (ms)
      description: >
        Delay between scene activation and the preset recall, so
        any `light.turn_on(rgb_color=…)` from the scene's own
        snapshot finishes first and the bridge's recipe replay
        wins. 200 ms is plenty in normal cases; raise if you see
        a brief flicker before the preset color settles.
      default: 200
      selector:
        number:
          min: 0
          max: 2000
          step: 50
          unit_of_measurement: ms
    preset_recall_service:
      name: Preset recall service
      description: >
        ESPHome service for preset recall. Default matches the
        headless bridge variant. Override only if you renamed the
        device away from the default `colorsplash_xg_bridge`.
      default: esphome.colorsplash_xg_bridge_color_preset_recall
      selector:
        text:

# Allow multiple scene activations to fire concurrent recalls
# without queueing — the bridge's BLE write queue serializes the
# protocol writes, so last-writer-wins on rapid activations.
mode: parallel

trigger:
  - platform: event
    event_type: call_service
    event_data:
      domain: scene
      service: turn_on
      service_data:
        entity_id: !input target_scene

action:
  - delay:
      milliseconds: !input recall_delay_ms
  - service: !input preset_recall_service
    data:
      slug: !input preset_slug
