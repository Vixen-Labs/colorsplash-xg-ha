# ColorSplash XG dashboard card — stock-Lovelace version.
#
# Paste this into a Lovelace dashboard (or a subview) to get a
# cohesive pool-control surface using only HA's built-in card
# types. No custom resources required.
#
# Entities expected (the prefix `colorsplash_xg_bridge_` comes from
# the headless variant's `friendly_name: ColorSplash XG Bridge` —
# HA auto-prepends the device-name slug to every entity from the
# integration). For the display variant, the prefix is
# `colorsplash_xg_` instead (no `_bridge`).
#
#   light.colorsplash_xg_bridge_pool_light             on/off + 12 effects
#                                                       (5 solids + 7 shows)
#   select.colorsplash_xg_bridge_pool_active_preset    user-saved presets
#   button.colorsplash_xg_bridge_pool_color_return     0x0E (replays)
#   button.colorsplash_xg_bridge_pool_color_lock       0x0D (captures)
#
# If you renamed the device or entities in HA, update the matching
# `entity:` lines below to the real IDs you see under
# Settings → Devices & Services → ColorSplash XG. The custom JS
# card in colorsplash-xg-card.js exposes a single `prefix:` config
# option for this — the stock-YAML version below requires editing
# each line individually.

type: vertical-stack
cards:
  # Master on/off + the 12 effects (5 solids + 7 shows) via HA's
  # standard light card. The fixture has no native brightness or
  # arbitrary RGB, so the firmware advertises ON_OFF color mode
  # only — HA hides the brightness slider and color wheel.
  - type: light
    entity: light.colorsplash_xg_bridge_pool_light
    name: Pool Light

  # User-saved presets — pick one to recall the exact recipe.
  # Options refresh as you save / delete presets via the JS card.
  - type: tile
    entity: select.colorsplash_xg_bridge_pool_active_preset
    name: Active Preset

  # Lock + Return — the controller's "last locked" slot. Lock
  # captures current displayed color; Return replays it.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: button.colorsplash_xg_bridge_pool_color_lock
        name: Color Lock
        color: amber
        icon: mdi:lock
      - type: tile
        entity: button.colorsplash_xg_bridge_pool_color_return
        name: Color Return
        color: grey
        icon: mdi:restore
