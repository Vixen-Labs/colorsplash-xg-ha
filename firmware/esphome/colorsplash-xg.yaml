---
# ColorSplash XG → ESPHome bridge, running on a Waveshare
# ESP32-S3-Touch-LCD-7 (N8R8: 8 MB flash, 8 MB octal PSRAM).
#
# Current scope (Phase 2 complete + Phase 3 #14 display bring-up):
#   - Boot, Wi-Fi, HA API, OTA, captive-portal fallback (#9)
#   - BLE client + self-discovery (#10)
#   - `light.pool_light` + 5 solid-color buttons + Lock/Return (#11)
#   - Watchdog + auto-reconnect + diagnostic sensors (#12 / #13)
#   - 800×480 RGB panel + GT911 touch + LVGL hello-world (#14)
#
# See firmware/esphome/README.md for setup and flashing steps.

substitutions:
  device_name: colorsplash-xg
  friendly_name: ColorSplash XG

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  # Waveshare ships this board with two module variants — N8R8 (8 MB
  # flash, 8 MB octal PSRAM) or N16R8 (16 MB / 8 MB). esptool's flash
  # autodetect on this board reported 8 MB, so we declare N8R8. Running
  # a mismatched flash_size causes a silent boot failure (partition
  # table points past end of flash).
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended

# Waveshare ESP32-S3-Touch-LCD-7 ships with the N16R8 module: 8 MB
# octal PSRAM at 80 MHz. Must be declared explicitly or Phase 3's LVGL
# buffers will land in SRAM and blow the heap.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 115200
  # Route logs to the ESP32-S3's built-in USB-JTAG/Serial controller
  # (the USB-C port labeled "USB" on the Waveshare board), not UART0.
  # UART0 goes to the CH343 bridge on the "UART1" port — which we
  # don't use for flashing (it can't reliably upload; see README).
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

# Captive portal on the fallback AP so a phone can configure Wi-Fi if
# the primary network is unreachable.
captive_portal:

# ColorSplash XG custom component (issue #10). Scans for the
# controller's advertised local name "BGScripr" and auto-connects.
# Component source lives in ./components/colorsplash_xg/.
external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:

colorsplash_xg:
  id: xg
  # Optional override for environments with multiple BGScripr
  # peripherals in range (uncommon). When unset, we match the first
  # advertiser whose local name equals BGScripr.
  # mac_address: "AA:BB:CC:DD:EE:FF"

# HA-facing light entity (#11). on/off maps to the controller's
# Standby byte; the 12 canonical effects (5 solids + 7 shows) are
# auto-registered by the colorsplash_xg/light platform. Restore
# to OFF on boot — the fixture's true state isn't readable, so we
# don't pretend to restore the effect; the user re-selects on use.
light:
  - platform: colorsplash_xg
    colorsplash_xg_id: xg
    id: pool_light
    name: "Pool Light"
    restore_mode: ALWAYS_OFF
    # Fires any time the light's on/off or effect changes — from
    # HA, from our LVGL UI, or from initial NVS restore. The lambda
    # reads the component's last_preset_byte() + is_on() and
    # updates every LVGL tile's highlight + the header current-
    # effect label. Single trigger covers screen ↔ HA both ways.
    on_state:
      - lambda: |-
          const bool on = id(pool_light).current_values.is_on();
          const auto last = id(xg).last_preset_byte();
          auto match = [&](uint8_t byte) {
            return on && last.has_value() && *last == byte;
          };
          auto apply = [&](lv_obj_t *obj, bool checked) {
            if (checked) lv_obj_add_state(obj, LV_STATE_CHECKED);
            else         lv_obj_remove_state(obj, LV_STATE_CHECKED);
          };
          apply(id(tile_blue),        match(0x08));
          apply(id(tile_red),         match(0x0A));
          apply(id(tile_white),       match(0x0B));
          apply(id(tile_pink),        match(0x0C));
          apply(id(tile_green),       match(0x09));
          apply(id(tile_nova),        match(0x07));
          apply(id(tile_super_nova),  match(0x02));
          apply(id(tile_northern),    match(0x03));
          apply(id(tile_tidal),       match(0x04));
          apply(id(tile_patriot),     match(0x05));
          apply(id(tile_desert),      match(0x06));
          apply(id(tile_peruvian),    match(0x01));
          // Header status: show the effect name (or "Off" when off,
          // or "On" when on without a recognised preset — e.g.
          // right after a Return).
          const char *caption = "Off";
          if (on) {
            if (last.has_value()) {
              const char *n = esphome::colorsplash_xg::decode_byte(*last);
              caption = (n != nullptr) ? n : "On";
            } else {
              caption = "On";
            }
          }
          lv_label_set_text(id(lbl_current), caption);
          // Power button checked state reflects on/off so its amber
          // highlight is the at-a-glance "is the pool light on?".
          apply(id(btn_power), on);

# The 5 solid colors and the 2 show-control primitives (Lock,
# Return) are all exposed as button entities. HA light entities
# can't constrain their color picker to a discrete palette, so
# buttons give a 1:1 mapping to the fixture's real presets and
# avoid the impedance mismatch of HA's 8-swatch default palette
# being shown for a light with only 5 colors. The dashboard card
# groups these together visually.
button:
  # Solid colors — send the effect byte directly.
  - platform: template
    name: "Pool Parisian Blue"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x08);'
  - platform: template
    name: "Pool Brazilian Red"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0a);'
  - platform: template
    name: "Pool Arctic White"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0b);'
  - platform: template
    name: "Pool Miami Pink"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0c);'
  - platform: template
    name: "Pool New Zealand Green"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x09);'
  # Show-control primitives — act on the controller's internal
  # "last locked" slot. Lock captures current displayed color;
  # Return replays it.
  - platform: template
    name: "Pool Lock"
    icon: "mdi:lock"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0d);'
  - platform: template
    name: "Pool Return"
    icon: "mdi:restore"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0e);'

# Watchdog surface for HA (#12). The binary_sensor mirrors the BLE
# client's connected() state so HA can flag a disconnected fixture
# in automations / dashboards; the text_sensor exposes the most
# recent BLE error so the user has immediate feedback without
# having to open the ESPHome logs.
binary_sensor:
  - platform: template
    name: "Pool BLE Connected"
    id: pool_ble_connected
    device_class: connectivity
    lambda: 'return id(xg).connected();'

text_sensor:
  - platform: template
    name: "Pool Last BLE Error"
    id: pool_last_ble_error
    update_interval: 15s
    lambda: 'return id(xg).last_error();'
  - platform: template
    name: "Pool Last Command"
    id: pool_last_command
    update_interval: 15s
    lambda: 'return id(xg).last_command_name();'

# Numeric diagnostics (#13). RSSI is polled every 30 s while
# connected; the two counters are monotonic-within-session totals
# that reset on reboot.
sensor:
  - platform: template
    name: "Pool BLE RSSI"
    id: pool_ble_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int8_t v = id(xg).last_rssi();
      if (v == 0) return NAN;  // 0 = not yet queried / disconnected
      return (float) v;
  - platform: template
    name: "Pool Command Count"
    id: pool_command_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_commands();'
  - platform: template
    name: "Pool Error Count"
    id: pool_error_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_errors();'

# ─── Phase 3 #14: display + touch + LVGL ────────────────────────
# Waveshare ESP32-S3-Touch-LCD-7 (800×480 RGB parallel + GT911 cap
# touch + CH422G I/O expander). ESPHome ships presets for all the
# scary parts — RGB pin map, timing, and touch driver. Only the
# I²C and touch interrupt/reset pin selections are community-
# reference (not covered by the board preset); values below are
# Waveshare's canonical wiring and may need adjustment if the
# screen is black on first flash.

i2c:
  id: bus_a
  sda: 8
  scl: 9
  frequency: 400kHz

# The CH422G drives the LCD reset + enable + (likely) backlight
# lines so the MCU keeps those 4 GPIOs free. Its I²C address is
# fixed in hardware — no `address:` needed.
ch422g:
  id: io_expander
  i2c_id: bus_a

display:
  - platform: mipi_rgb
    id: main_display
    model: ESP32-S3-TOUCH-LCD-7-800X480
    # Rotation is declared on the LVGL block below — the mipi_rgb
    # display must be in its native orientation here; LVGL handles
    # the rotated render.

touchscreen:
  - platform: gt911
    id: pool_touch
    i2c_id: bus_a
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_expander
      number: 1
    display: main_display
    # Touch coordinates must match the rotated display. For 270° CW
    # rotation: swap X/Y axes and mirror one. If taps register in
    # the wrong corner, toggle mirror_x vs mirror_y (or both).
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d id=%d",
                   touch.x, touch.y, touch.id);

# ─── Phase 3 #15: LVGL main screen ──────────────────────────────
# Portrait 480×800. Header (power + title + current effect). Two
# sections: Colors (5 solids + R-badge Return) and Shows (7 shows
# with gradient backgrounds, and the Lock button sharing the last
# row). Tile taps dispatch bytes directly (solids, Lock, Return)
# or via the light entity (shows, via effect selection). The
# active-effect highlight follows `id(xg).last_preset_byte()`,
# which stays in sync regardless of whether the change came from
# the screen, HA, or an automation.

lvgl:
  displays: main_display
  touchscreens: pool_touch
  # 270° CW rotation → native 800×480 landscape becomes 480×800
  # portrait with the USB edge at the bottom. If the panel comes
  # up upside-down, change to 90.
  rotation: 270
  # Page-wide dark background so the colored tiles pop.
  bg_color: 0x0D0D14
  text_color: 0xF0F0F0
  # Global touch-pressed feel — dim slightly on any button-like
  # widget. Keeps the press response fast and visible without
  # animation overhead.
  theme:
    button:
      pressed:
        bg_opa: 70%
  pages:
    - id: page_main
      bg_color: 0x0D0D14
      pad_all: 12
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: start
        flex_align_cross: center
        pad_row: 14
      widgets:

        # ─── Header row ─────────────────────────────────────────
        - obj:
            width: 100%
            height: 80
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              # Power button — left side.
              - button:
                  id: btn_power
                  width: 64
                  height: 64
                  radius: 32
                  bg_color: 0x1E1E28
                  shadow_width: 8
                  shadow_opa: 40%
                  checked:
                    bg_color: 0xFFBF1C   # amber when "on"
                  on_click:
                    - light.toggle: pool_light
                  widgets:
                    - label:
                        text: "\uF011"   # LV_SYMBOL_POWER
                        text_font: montserrat_28
                        align: CENTER
                        text_color: 0xF0F0F0
              # Title + current-effect stack — right side.
              - obj:
                  width: size_content
                  height: size_content
                  pad_all: 0
                  bg_opa: transp
                  border_width: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: end
                  widgets:
                    - label:
                        text: "Pool Light"
                        text_font: montserrat_24
                        text_color: 0xF0F0F0
                    - label:
                        id: lbl_current
                        text: "Off"
                        text_font: montserrat_14
                        text_color: 0x888899

        # ─── Colors section header ──────────────────────────────
        - label:
            text: "Colors"
            text_font: montserrat_16
            text_color: 0x888899
            align: LEFT_MID

        # ─── Colors tile grid: 3×2 ──────────────────────────────
        - obj:
            width: 100%
            height: 240
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_between
              flex_align_cross: center
              pad_row: 10
              pad_column: 10
            widgets:
              - button:
                  id: tile_blue
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0x0000FF
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x08);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "Parisian\nBlue"
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: CENTER

              - button:
                  id: tile_red
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFF0000
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0a);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "Brazilian\nRed"
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: CENTER

              - button:
                  id: tile_white
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFFFFFF
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  border_width: 1
                  border_color: 0x444455
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFBF1C
                    outline_pad: 3
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0b);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "Arctic\nWhite"
                        text_color: 0x111111
                        text_align: CENTER
                        align: CENTER

              - button:
                  id: tile_pink
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFF00FF
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0c);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "Miami\nPink"
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: CENTER

              - button:
                  id: tile_green
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0x00FF00
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x09);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "New Zealand\nGreen"
                        text_color: 0x111111
                        text_align: CENTER
                        align: CENTER

              # Return — styled as a "swatch" with the canonical "R"
              # badge the #41 spec calls for. Gray base since we don't
              # know the locked color until Lock is pressed.
              - button:
                  id: tile_return
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0x3A3A44
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0e);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - label:
                        text: "R"
                        text_font: montserrat_48
                        text_color: 0xF0F0F0
                        align: TOP_MID
                        y: 6
                    - label:
                        text: "Return"
                        text_font: montserrat_14
                        text_color: 0xC0C0CC
                        align: BOTTOM_MID
                        y: -8

        # ─── Shows section header ───────────────────────────────
        - label:
            text: "Shows"
            text_font: montserrat_16
            text_color: 0x888899
            align: LEFT_MID

        # ─── Shows tile grid: 3×2 + (1 + Lock) ──────────────────
        # Each show tile has a 2-stop linear gradient approximating
        # the multi-color sequence documented in PROTOCOL.md §Show
        # color gradients. The gradient conveys the show's identity
        # even without running the actual animation.
        - obj:
            width: 100%
            height: 360
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_between
              flex_align_cross: center
              pad_row: 10
              pad_column: 10
            widgets:
              - button:
                  id: tile_nova
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFEEA00       # yellow (first)
                  bg_grad_color: 0xDC0BB3  # magenta (cycle endpoint)
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Nova");
                        call.perform();
                  widgets:
                    - label:
                        text: "Nova"
                        text_font: montserrat_18
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_super_nova
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0x71CD2E
                  bg_grad_color: 0x1649D5
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Super Nova");
                        call.perform();
                  widgets:
                    - label:
                        text: "Super\nNova"
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_northern
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFD3000       # red-orange
                  bg_grad_color: 0x0E65F7  # blue
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Northern Lights");
                        call.perform();
                  widgets:
                    - label:
                        text: "Northern\nLights"
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_tidal
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0x00A351       # green
                  bg_grad_color: 0x0675AB  # blue
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Tidal Wave");
                        call.perform();
                  widgets:
                    - label:
                        text: "Tidal\nWave"
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_patriot
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xE32139       # red
                  bg_grad_color: 0x398CC6  # blue (white is in middle, 2-stop approximation)
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Patriot Dream");
                        call.perform();
                  widgets:
                    - label:
                        text: "Patriot\nDream"
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_desert
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFFB347       # amber (guess — PROTOCOL.md marks endpoints unknown)
                  bg_grad_color: 0xC9327B  # magenta (ditto)
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Desert Skies");
                        call.perform();
                  widgets:
                    - label:
                        text: "Desert\nSkies"
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        align: CENTER

              - button:
                  id: tile_peruvian
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFFFFFF       # white (gradient starts white)
                  bg_grad_color: 0x1ABC9C  # teal (gradient ends teal)
                  bg_grad_dir: VER
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  border_width: 1
                  border_color: 0x444455
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFBF1C
                    outline_pad: 3
                  on_click:
                    - lambda: |-
                        auto call = id(pool_light).turn_on();
                        call.set_effect("Peruvian Paradise");
                        call.perform();
                  widgets:
                    - label:
                        text: "Peruvian\nParadise"
                        text_align: CENTER
                        text_color: 0x111111
                        align: CENTER

              # Lock — pairs with Return on the colors row; placed at
              # the tail of the shows grid to fill the 8th slot.
              # Lock is an action, not a mode, so it's not checkable.
              - button:
                  id: tile_lock
                  width: 140
                  height: 110
                  radius: 16
                  bg_color: 0xFFBF1C       # amber — distinct from both color swatches + show gradients
                  bg_opa: cover
                  shadow_width: 10
                  shadow_opa: 40%
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0d);'
                  widgets:
                    - label:
                        text: "\uF023"     # LV_SYMBOL_LOCK
                        text_font: montserrat_28
                        text_color: 0x111111
                        align: TOP_MID
                        y: 10
                    - label:
                        text: "Lock"
                        text_font: montserrat_16
                        text_color: 0x111111
                        align: BOTTOM_MID
                        y: -10
