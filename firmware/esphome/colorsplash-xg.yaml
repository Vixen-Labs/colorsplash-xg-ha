---
# ColorSplash XG → ESPHome bridge, running on a Waveshare
# ESP32-S3-Touch-LCD-7 (N8R8: 8 MB flash, 8 MB octal PSRAM).
#
# Current scope (Phase 2 complete + Phase 3 #14 display bring-up):
#   - Boot, Wi-Fi, HA API, OTA, captive-portal fallback (#9)
#   - BLE client + self-discovery (#10)
#   - `light.pool_light` + 5 solid-color buttons + Lock/Return (#11)
#   - Watchdog + auto-reconnect + diagnostic sensors (#12 / #13)
#   - 800×480 RGB panel + GT911 touch + LVGL hello-world (#14)
#
# See firmware/esphome/README.md for setup and flashing steps.

substitutions:
  device_name: colorsplash-xg
  friendly_name: ColorSplash XG

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  # Waveshare ships this board with two module variants — N8R8 (8 MB
  # flash, 8 MB octal PSRAM) or N16R8 (16 MB / 8 MB). esptool's flash
  # autodetect on this board reported 8 MB, so we declare N8R8. Running
  # a mismatched flash_size causes a silent boot failure (partition
  # table points past end of flash).
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    # Required for octal-PSRAM at 120 MHz (still flagged experimental
    # upstream by Espressif; Waveshare's reference enables it
    # explicitly).
    advanced:
      enable_idf_experimental_features: true
    # Additional vendor-recommended sdkconfig values from Waveshare's
    # official ESP-IDF reference (waveshareteam/ESP32-S3-Touch-LCD-7B
    # example 13_LVGL_TRANSPLANT). Performance tunings that benefit
    # RGB-panel + LVGL workloads.
    #
    # NOTE: Waveshare's reference also sets
    # CONFIG_LV_ATTRIBUTE_FAST_MEM_USE_IRAM=y, but that's specific to
    # ESP-IDF's managed-components LVGL packaging. ESPHome uses a
    # different LVGL packaging that doesn't define the corresponding
    # macro under that Kconfig — enabling it produces compile
    # errors. Skipped here.
    sdkconfig_options:
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y

# Waveshare ESP32-S3-Touch-LCD-7 ships with the N16R8 module: 8 MB
# octal PSRAM at 80 MHz. Must be declared explicitly or Phase 3's LVGL
# buffers will land in SRAM and blow the heap.
psram:
  mode: octal
  # Vendor-recommended (Waveshare's sdkconfig.defaults uses
  # CONFIG_SPIRAM_SPEED_120M=y). 50% faster PSRAM bus than 80MHz
  # gives the RGB panel DMA enough margin against WiFi/BLE
  # contention to eliminate scanline tearing. 120MHz is marked
  # experimental in upstream ESP-IDF — the framework
  # sdkconfig_options block above sets the required experimental
  # flag.
  speed: 120MHz

logger:
  level: INFO
  baud_rate: 115200
  # Route logs to the ESP32-S3's built-in USB-JTAG/Serial controller
  # (the USB-C port labeled "USB" on the Waveshare board), not UART0.
  # UART0 goes to the CH343 bridge on the "UART1" port — which we
  # don't use for flashing (it can't reliably upload; see README).
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

# Captive portal on the fallback AP so a phone can configure Wi-Fi if
# the primary network is unreachable.
captive_portal:

# ColorSplash XG custom component (issue #10). Scans for the
# controller's advertised local name "BGScripr" and auto-connects.
# Component source lives in ./components/colorsplash_xg/.
external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:

colorsplash_xg:
  id: xg
  # Optional override for environments with multiple BGScripr
  # peripherals in range (uncommon). When unset, we match the first
  # advertiser whose local name equals BGScripr.
  # mac_address: "AA:BB:CC:DD:EE:FF"

# HA-facing light entity (#11). on/off maps to the controller's
# Standby byte; the 12 canonical effects (5 solids + 7 shows) are
# auto-registered by the colorsplash_xg/light platform. Restore
# to OFF on boot — the fixture's true state isn't readable, so we
# don't pretend to restore the effect; the user re-selects on use.
light:
  - platform: colorsplash_xg
    colorsplash_xg_id: xg
    id: pool_light
    name: "Pool Light"
    restore_mode: ALWAYS_OFF
    # Fires any time the light's on/off or effect changes — from
    # HA, from our LVGL UI, or from initial NVS restore. The lambda
    # reads the component's last_preset_byte() + is_on() and
    # updates every LVGL tile's highlight + the header current-
    # effect label. Single trigger covers screen ↔ HA both ways.
    on_state:
      - lambda: |-
          const bool on = id(pool_light).current_values.is_on();
          const auto last = id(xg).last_preset_byte();
          auto match = [&](uint8_t byte) {
            return on && last.has_value() && *last == byte;
          };
          auto apply = [&](lv_obj_t *obj, bool checked) {
            if (checked) lv_obj_add_state(obj, LV_STATE_CHECKED);
            else         lv_obj_remove_state(obj, LV_STATE_CHECKED);
          };
          // Color circles track the active solid preset.
          apply(id(circle_blue),  match(0x08));
          apply(id(circle_red),   match(0x0A));
          apply(id(circle_white), match(0x0B));
          apply(id(circle_pink),  match(0x0C));
          apply(id(circle_green), match(0x09));
          // Switch tracks on/off.
          apply(id(sw_power), on);
          // Dropdown tracks the current effect index. 0 = None;
          // 1-7 = shows in the same order as the YAML options list.
          uint16_t idx = 0;
          if (on && last.has_value()) {
            switch (*last) {
              case 0x07: idx = 1; break;  // Nova
              case 0x02: idx = 2; break;  // Super Nova
              case 0x03: idx = 3; break;  // Northern Lights
              case 0x04: idx = 4; break;  // Tidal Wave
              case 0x05: idx = 5; break;  // Patriot Dream
              case 0x06: idx = 6; break;  // Desert Skies
              case 0x01: idx = 7; break;  // Peruvian Paradise
              default:   idx = 0; break;  // solid / lock / return
            }
          }
          id(dd_effect)->set_selected_index(idx, LV_ANIM_OFF);
          // Subtitle: "Off", "On", "Currently: Nova", etc.
          char buf[48];
          if (!on) {
            std::strcpy(buf, "Off");
          } else if (last.has_value()) {
            const char *n = esphome::colorsplash_xg::decode_byte(*last);
            std::snprintf(buf, sizeof(buf), "Currently: %s",
                          n ? n : "(unknown)");
          } else {
            std::strcpy(buf, "On");
          }
          lv_label_set_text(id(lbl_current), buf);

# The 5 solid colors and the 2 show-control primitives (Lock,
# Return) are all exposed as button entities. HA light entities
# can't constrain their color picker to a discrete palette, so
# buttons give a 1:1 mapping to the fixture's real presets and
# avoid the impedance mismatch of HA's 8-swatch default palette
# being shown for a light with only 5 colors. The dashboard card
# groups these together visually.
button:
  # Solid colors — send the effect byte directly.
  - platform: template
    name: "Pool Parisian Blue"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x08);'
  - platform: template
    name: "Pool Brazilian Red"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0a);'
  - platform: template
    name: "Pool Arctic White"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0b);'
  - platform: template
    name: "Pool Miami Pink"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0c);'
  - platform: template
    name: "Pool New Zealand Green"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x09);'
  # Show-control primitives — act on the controller's internal
  # "last locked" slot. Lock captures current displayed color;
  # Return replays it.
  - platform: template
    name: "Pool Lock"
    icon: "mdi:lock"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0d);'
  - platform: template
    name: "Pool Return"
    icon: "mdi:restore"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0e);'

# Watchdog surface for HA (#12). The binary_sensor mirrors the BLE
# client's connected() state so HA can flag a disconnected fixture
# in automations / dashboards; the text_sensor exposes the most
# recent BLE error so the user has immediate feedback without
# having to open the ESPHome logs.
binary_sensor:
  - platform: template
    name: "Pool BLE Connected"
    id: pool_ble_connected
    device_class: connectivity
    lambda: 'return id(xg).connected();'

text_sensor:
  - platform: template
    name: "Pool Last BLE Error"
    id: pool_last_ble_error
    update_interval: 15s
    lambda: 'return id(xg).last_error();'
  - platform: template
    name: "Pool Last Command"
    id: pool_last_command
    update_interval: 15s
    lambda: 'return id(xg).last_command_name();'

# Numeric diagnostics (#13). RSSI is polled every 30 s while
# connected; the two counters are monotonic-within-session totals
# that reset on reboot.
sensor:
  - platform: template
    name: "Pool BLE RSSI"
    id: pool_ble_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int8_t v = id(xg).last_rssi();
      if (v == 0) return NAN;  // 0 = not yet queried / disconnected
      return (float) v;
  - platform: template
    name: "Pool Command Count"
    id: pool_command_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_commands();'
  - platform: template
    name: "Pool Error Count"
    id: pool_error_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_errors();'

# Custom font for the Bluetooth status icon — bundled Montserrat
# doesn't carry the FA Bluetooth glyph at usable sizes. Pull
# Material Symbols Outlined from Google Fonts at compile time and
# bake in only the single glyph we need (U+E1A7 = bluetooth).
font:
  - file: "gfonts://Material Symbols Outlined"
    id: icon_font_18
    size: 18
    glyphs:
      - "\uE1A7"  # bluetooth

# ─── Phase 3 #17: status bar polling ────────────────────────────
# Refreshes the four status-bar icons in the LVGL UI once per
# second so each indicator reflects live system health within ~1 s
# (the issue's acceptance window). State sources:
#   - WiFi:   wifi::global_wifi_component->is_connected()
#   - HA API: api::global_api_server->is_connected()
#   - BLE:    id(xg).connected() (BLEClientBase ESTABLISHED)
#   - RSSI:   id(xg).last_rssi() (polled every 30s by the BLE
#             component; 0 when disconnected)
# Colour scheme: green (#71CD2E) = healthy, grey (#666677) = idle
# / not yet connected, red (#E32139) = unhealthy.
interval:
  - interval: 1s
    then:
      - lambda: |-
          const auto OK    = lv_color_hex(0x71CD2E);
          const auto IDLE  = lv_color_hex(0x666677);
          const auto BAD   = lv_color_hex(0xE32139);
          const auto MUTED = lv_color_hex(0x888899);
          // WiFi
          const bool wifi_up =
              esphome::wifi::global_wifi_component->is_connected();
          lv_obj_set_style_text_color(
              id(lbl_status_wifi), wifi_up ? OK : BAD, 0);
          // HA API
          const bool api_up =
              esphome::api::global_api_server->is_connected();
          lv_obj_set_style_text_color(
              id(lbl_status_api), api_up ? OK : IDLE, 0);
          // BLE link to the controller
          const bool ble_up = id(xg).connected();
          lv_obj_set_style_text_color(
              id(lbl_status_ble), ble_up ? OK : BAD, 0);
          // 5-bar RSSI indicator empirically calibrated against
          // actual ESP32-S3-Touch-LCD-7 ↔ ColorSplash readings:
          // 1 ft separation steady-states at ~-58 dBm; the
          // watchdog test saw -56 to -66 dBm at 1-2 m. Anchor the
          // scale so close-range = full bars, "across the room"
          // ≈ 3 bars, and the real connect-loss threshold (around
          // -88 dBm on this hardware) lights only one. RSSI of 0
          // means "not yet known" → all bars off.
          const int8_t rssi = id(xg).last_rssi();
          int bars = 0;
          if (rssi != 0) {
            if (rssi >= -88) bars = 1;
            if (rssi >= -82) bars = 2;
            if (rssi >= -75) bars = 3;
            if (rssi >= -68) bars = 4;
            if (rssi >= -60) bars = 5;
          }
          const auto BAR_OFF = lv_color_hex(0x333344);
          lv_obj_set_style_bg_color(
              id(rssi_bar_1), bars >= 1 ? OK : BAR_OFF, 0);
          lv_obj_set_style_bg_color(
              id(rssi_bar_2), bars >= 2 ? OK : BAR_OFF, 0);
          lv_obj_set_style_bg_color(
              id(rssi_bar_3), bars >= 3 ? OK : BAR_OFF, 0);
          lv_obj_set_style_bg_color(
              id(rssi_bar_4), bars >= 4 ? OK : BAR_OFF, 0);
          lv_obj_set_style_bg_color(
              id(rssi_bar_5), bars >= 5 ? OK : BAR_OFF, 0);

# ─── Phase 3 #14: display + touch + LVGL ────────────────────────
# Waveshare ESP32-S3-Touch-LCD-7 (800×480 RGB parallel + GT911 cap
# touch + CH422G I/O expander). ESPHome ships presets for all the
# scary parts — RGB pin map, timing, and touch driver. Only the
# I²C and touch interrupt/reset pin selections are community-
# reference (not covered by the board preset); values below are
# Waveshare's canonical wiring and may need adjustment if the
# screen is black on first flash.

i2c:
  id: bus_a
  sda: 8
  scl: 9
  frequency: 400kHz

# The CH422G drives the LCD reset + enable + (likely) backlight
# lines so the MCU keeps those 4 GPIOs free. Its I²C address is
# fixed in hardware — no `address:` needed.
ch422g:
  id: io_expander
  i2c_id: bus_a

display:
  - platform: mipi_rgb
    id: main_display
    model: ESP32-S3-TOUCH-LCD-7-800X480
    # Rotation is declared on the LVGL block below — the mipi_rgb
    # display must be in its native orientation here; LVGL handles
    # the rotated render.

touchscreen:
  - platform: gt911
    id: pool_touch
    i2c_id: bus_a
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_expander
      number: 1
    display: main_display
    # When `lvgl.rotation:` is active, LVGL rotates the incoming
    # touch coordinates itself. Leaving a `transform:` here applies
    # a second rotation on top, scrambling the mapping. Keep this
    # in its default identity orientation.
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d id=%d",
                   touch.x, touch.y, touch.id);

# ─── Phase 3 #15: LVGL main screen (HA-card style) ──────────────
# Portrait 480×800. Layout mirrors Home Assistant's standard
# light-entity card:
#   - Title + current-state subtitle at top
#   - Off/On switch widget (HA-style toggle)
#   - "Color" section — 5 circular swatches matching the fixture's
#     pure-primary LEDs
#   - "Effect" section — dropdown with None + 7 show names
#   - Bottom action row — Lock + Return
# State sync via `light.on_state` reflects the entity's state into
# the switch position, selected color ring, dropdown index, and
# subtitle text — regardless of whether the change originated on
# the screen, in HA, or from an automation.

lvgl:
  displays: main_display
  touchscreens: pool_touch
  # 90° CW rotation → USB edge at the bottom. Stable now that
  # PSRAM is at 120 MHz + the patched mipi_rgb has num_fbs=2 +
  # bb_invalidate_cache + 64-byte alignment. Earlier glitch
  # troubleshooting falsely implicated rotation; the real cause
  # was PSRAM-bus contention — see docs/WAVESHARE_LCD_TUNING.md.
  rotation: 90
  # Tear-free recipe (combined with patched mipi_rgb num_fbs=2):
  #   - buffer_size: 100% gives LVGL its own back-buffer matching
  #     the rotated dimensions
  #   - full_refresh: true forces a whole-screen render each tick
  #     so the swap to the front framebuffer is atomic
  # ESP-IDF's `esp_lcd_panel_draw_bitmap` with num_fbs=2 writes to
  # the inactive framebuffer and swaps on vsync; pairing that with
  # full-screen writes (no partial dirty regions) avoids
  # mid-frame swap artefacts that show up as vertical scanline
  # offsets.
  buffer_size: 100%
  full_refresh: true
  bg_color: 0x0D0D14
  text_color: 0xF0F0F0
  theme:
    button:
      pressed:
        bg_opa: 70%
  pages:
    - id: page_main
      bg_color: 0x0D0D14
      pad_all: 20
      scrollable: false
      layout:
        type: flex
        flex_flow: column
        flex_align_main: start
        flex_align_cross: center
        pad_row: 16
      widgets:

        # ─── Status bar (#17) ────────────────────────────────────
        # Four glanceable indicators at the very top of the page:
        # Wi-Fi, HA API, BLE-to-controller, BLE RSSI. Each label
        # is updated by the interval timer below; colour is the
        # at-a-glance health signal (green = good, grey = unknown
        # / not yet connected, red = fail).
        - obj:
            width: 100%
            height: 24
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
              pad_column: 4
            widgets:
              - label:
                  id: lbl_status_wifi
                  text: "\uF1EB"          # LV_SYMBOL_WIFI
                  text_font: montserrat_18
                  text_color: 0x666677
              - label:
                  id: lbl_status_api
                  text: "\uF015"          # LV_SYMBOL_HOME (HA proxy)
                  text_font: montserrat_18
                  text_color: 0x666677
              - label:
                  id: lbl_status_ble
                  text: "\uE1A7"          # Material Symbols bluetooth
                  text_font: icon_font_18
                  text_color: 0x666677
              # 5-bar RSSI indicator. Each bar is a tiny styled
              # rectangle (~3 px wide × increasing height). The
              # polling lambda below sets bg_color per bar based on
              # last_rssi() — bright when signal is strong enough
              # to "earn" that bar, muted otherwise.
              - obj:
                  width: 24
                  height: 16
                  pad_all: 0
                  bg_opa: transp
                  border_width: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: end
                    flex_align_cross: end
                    pad_column: 1
                  widgets:
                    - obj: {id: rssi_bar_1, width: 3, height: 4,  radius: 1, bg_color: 0x333344, bg_opa: cover, border_width: 0}
                    - obj: {id: rssi_bar_2, width: 3, height: 6,  radius: 1, bg_color: 0x333344, bg_opa: cover, border_width: 0}
                    - obj: {id: rssi_bar_3, width: 3, height: 9,  radius: 1, bg_color: 0x333344, bg_opa: cover, border_width: 0}
                    - obj: {id: rssi_bar_4, width: 3, height: 12, radius: 1, bg_color: 0x333344, bg_opa: cover, border_width: 0}
                    - obj: {id: rssi_bar_5, width: 3, height: 15, radius: 1, bg_color: 0x333344, bg_opa: cover, border_width: 0}

        # ─── Header: title + current state ──────────────────────
        - label:
            text: "Pool Light"
            text_font: montserrat_28
            text_color: 0xF0F0F0
        - label:
            id: lbl_current
            text: "Off"
            text_font: montserrat_14
            text_color: 0x888899

        # ─── On/Off switch row ──────────────────────────────────
        # Classic HA pattern: Off label · switch · On label.
        - obj:
            width: size_content
            height: size_content
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 16
            widgets:
              - label:
                  text: "Off"
                  text_color: 0x888899
                  text_font: montserrat_16
              - switch:
                  id: sw_power
                  width: 80
                  height: 40
                  # Subtle track when off, amber when on — matches
                  # HA's default light-entity accent.
                  bg_color: 0x333344
                  indicator:
                    bg_color: 0x333344
                    checked:
                      bg_color: 0xFFBF1C
                  on_value:
                    - if:
                        condition:
                          lambda: 'return x;'
                        then:
                          - light.turn_on: pool_light
                        else:
                          - light.turn_off: pool_light
              - label:
                  text: "On"
                  text_color: 0x888899
                  text_font: montserrat_16

        # ─── Divider ────────────────────────────────────────────
        - obj:
            width: 100%
            height: 1
            bg_color: 0x222233
            bg_opa: cover
            border_width: 0

        # ─── Color section ──────────────────────────────────────
        - label:
            text: "Color"
            text_font: montserrat_16
            text_color: 0x888899
            align: LEFT_MID
        # 5 circular swatches in a row. Each is a checkable button
        # with radius=36 for a perfect circle; active highlight is
        # a white outline ring (amber on light-coloured swatches).
        - obj:
            width: 100%
            height: 100
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              - button:
                  id: circle_blue
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0x0000FF
                  bg_opa: cover
                  shadow_width: 8
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 4
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x08);'
                    - light.turn_on: {id: pool_light}

              - button:
                  id: circle_red
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0xFF0000
                  bg_opa: cover
                  shadow_width: 8
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 4
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0a);'
                    - light.turn_on: {id: pool_light}

              - button:
                  id: circle_white
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0xFFFFFF
                  bg_opa: cover
                  border_width: 1
                  border_color: 0x444455
                  shadow_width: 8
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFBF1C
                    outline_pad: 4
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0b);'
                    - light.turn_on: {id: pool_light}

              - button:
                  id: circle_pink
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0xFF00FF
                  bg_opa: cover
                  shadow_width: 8
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 4
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0c);'
                    - light.turn_on: {id: pool_light}

              - button:
                  id: circle_green
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0x00FF00
                  bg_opa: cover
                  shadow_width: 8
                  shadow_opa: 40%
                  checkable: true
                  checked:
                    outline_width: 4
                    outline_color: 0xFFFFFF
                    outline_pad: 4
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x09);'
                    - light.turn_on: {id: pool_light}

        # ─── Divider ────────────────────────────────────────────
        - obj:
            width: 100%
            height: 1
            bg_color: 0x222233
            bg_opa: cover
            border_width: 0

        # ─── Effect section ─────────────────────────────────────
        - label:
            text: "Effect"
            text_font: montserrat_16
            text_color: 0x888899
            align: LEFT_MID
        - dropdown:
            id: dd_effect
            width: 100%
            height: 54
            text_font: montserrat_18
            bg_color: 0x1E1E28
            border_color: 0x333344
            border_width: 1
            options:
              - "None"
              - "Nova"
              - "Super Nova"
              - "Northern Lights"
              - "Tidal Wave"
              - "Patriot Dream"
              - "Desert Skies"
              - "Peruvian Paradise"
            # on_value fires with `x` = newly-selected index.
            on_value:
              - lambda: |-
                  static const char *const names[] = {
                      "", "Nova", "Super Nova", "Northern Lights",
                      "Tidal Wave", "Patriot Dream", "Desert Skies",
                      "Peruvian Paradise"};
                  if (x == 0) {
                    // "None" was picked — clear any active effect
                    // but leave the on/off state alone.
                    auto call = id(pool_light).turn_on();
                    call.set_effect("None");
                    call.perform();
                  } else if (x >= 1 && x <= 7) {
                    auto call = id(pool_light).turn_on();
                    call.set_effect(names[x]);
                    call.perform();
                  }

        # ─── Divider ────────────────────────────────────────────
        - obj:
            width: 100%
            height: 1
            bg_color: 0x222233
            bg_opa: cover
            border_width: 0

        # ─── Bottom actions: Lock + Return ──────────────────────
        - obj:
            width: 100%
            height: 80
            pad_all: 0
            bg_opa: transp
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
              pad_column: 16
            widgets:
              - button:
                  id: btn_lock
                  width: 200
                  height: 64
                  radius: 12
                  bg_color: 0x2A2A36
                  bg_opa: cover
                  shadow_width: 6
                  shadow_opa: 30%
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0d);'
                  widgets:
                    - obj:
                        width: size_content
                        height: size_content
                        pad_all: 0
                        bg_opa: transp
                        border_width: 0
                        align: CENTER
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 10
                        widgets:
                          - label:
                              text: "\uF023"  # LV_SYMBOL_LOCK
                              text_font: montserrat_20
                              text_color: 0xFFBF1C
                          - label:
                              text: "Lock"
                              text_font: montserrat_18
                              text_color: 0xF0F0F0
              - button:
                  id: btn_return
                  width: 200
                  height: 64
                  radius: 12
                  bg_color: 0x2A2A36
                  bg_opa: cover
                  shadow_width: 6
                  shadow_opa: 30%
                  on_click:
                    - lambda: 'id(xg).send_effect_byte(0x0e);'
                    - light.turn_on: {id: pool_light}
                  widgets:
                    - obj:
                        width: size_content
                        height: size_content
                        pad_all: 0
                        bg_opa: transp
                        border_width: 0
                        align: CENTER
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 10
                        widgets:
                          - label:
                              text: "\uF0E2"  # LV_SYMBOL_UNDO / return-like
                              text_font: montserrat_20
                              text_color: 0x71CD2E
                          - label:
                              text: "Return"
                              text_font: montserrat_18
                              text_color: 0xF0F0F0

