---
# ColorSplash XG → ESPHome bridge, headless variant.
#
# Targets a plain ESP32-WROOM-32 dev board placed near the
# equipment pad, where BLE link margin to the LPL-XG-CTRL-1 is
# strong. There's no display — the user-facing UI lives in Home
# Assistant (see ../../dashboard/colorsplash-xg.yaml for the
# stock-Lovelace card).
#
# Includes everything from the display variant except the LVGL
# UI, the RGB/touch panel, and the S3-specific PSRAM/IDF
# tunings. Shares the custom `colorsplash_xg` BLE component.
#
# For the touchscreen variant (Waveshare ESP32-S3-Touch-LCD-7),
# see colorsplash-xg-display.yaml or check out the v0.1.0-display
# tag.
#
# See firmware/esphome/README.md for setup and flashing steps.

substitutions:
  device_name: colorsplash-xg-bridge
  friendly_name: ColorSplash XG Bridge

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  # Plain ESP32-WROOM-32 dev kit. ESPHome's default `arduino`
  # framework is fine here — `ble_client` + Wi-Fi + native API +
  # the custom `colorsplash_xg` component all build cleanly
  # without any IDF-specific options.
  board: esp32dev
  # Standard WROOM-32 modules ship 4 MB. Some carry 8 or 16 MB —
  # adjust if `esptool flash_id` reports differently.
  flash_size: 4MB

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  # Phase 4b show-scrub proof-of-concept: a single primitive
  # exposed as a Home Assistant service. Sends `start_byte`,
  # waits `wait_ms`, then sends Lock (0x0d). With a determinist-
  # ic transition + fixed step duration per show, repeated calls
  # to (start_byte, wait_ms) should land the fixture on the same
  # colour each time. Used to validate that show-scrub is
  # precise enough for an arbitrary-RGB picker (Phase 4b proper)
  # before building the full RGB→(show, offset) mapping.
  #
  # For repeatability, normalise the from-state by sending
  # Standby first and pausing ~3 s before scrub:
  #
  #   - service: button.press
  #     target: { entity_id: button.pool_standby }   # if exposed
  #   - delay: 3
  #   - service: esphome.colorsplash_xg_bridge_pool_scrub
  #     data: { start_byte: 5, wait_ms: 12000 }      # 0x05 = Patriot Dream
  services:
    - service: pool_scrub
      variables:
        start_byte: int
        wait_ms: int
      then:
        - script.execute:
            id: pool_scrub_seq
            start_byte: !lambda 'return start_byte;'
            wait_ms: !lambda 'return wait_ms;'
    # Phase 4b calibration primitive — send a single arbitrary byte
    # to the controller. Used by `tools/calibrate_show_colors.py`
    # to drive the controller through Standby + every solid +
    # every show without needing per-byte HA buttons.
    - service: pool_send_byte
      variables:
        byte: int
      then:
        - lambda: 'id(xg).send_effect_byte((uint8_t) byte);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

# Captive portal on the fallback AP so a phone can configure Wi-Fi
# if the primary network is unreachable.
captive_portal:

# ColorSplash XG custom component (issue #10). Scans for the
# controller's advertised local name "BGScripr" and auto-connects.
# Component source lives in ./components/colorsplash_xg/.
external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:

colorsplash_xg:
  id: xg
  # Optional override for environments with multiple BGScripr
  # peripherals in range (uncommon). When unset, we match the first
  # advertiser whose local name equals BGScripr.
  # mac_address: "AA:BB:CC:DD:EE:FF"

# HA-facing light entity (#11). on/off maps to the controller's
# Standby byte; the 12 canonical effects (5 solids + 7 shows) are
# auto-registered by the colorsplash_xg/light platform. Restore
# to OFF on boot — the fixture's true state isn't readable, so we
# don't pretend to restore the effect; the user re-selects on use.
#
# No `on_state:` lambda here — the display variant uses one to
# update LVGL widget styles, but the headless variant has no
# widgets. HA gets fixture-state updates via the colorsplash_xg
# component's normal indication-echo path.
light:
  - platform: colorsplash_xg
    colorsplash_xg_id: xg
    id: pool_light
    name: "Pool Light"
    restore_mode: ALWAYS_OFF

# The 5 solid colors and the 2 show-control primitives (Lock,
# Return) are all exposed as button entities. HA light entities
# can't constrain their color picker to a discrete palette, so
# buttons give a 1:1 mapping to the fixture's real presets and
# avoid the impedance mismatch of HA's 8-swatch default palette
# being shown for a light with only 5 colors. The dashboard card
# groups these together visually.
button:
  # Solid colors — send the effect byte directly.
  - platform: template
    name: "Pool Parisian Blue"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x08);'
  - platform: template
    name: "Pool Brazilian Red"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0a);'
  - platform: template
    name: "Pool Arctic White"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0b);'
  - platform: template
    name: "Pool Miami Pink"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0c);'
  - platform: template
    name: "Pool New Zealand Green"
    icon: "mdi:palette"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x09);'
  # Show-control primitives — act on the controller's internal
  # "last locked" slot. Lock captures current displayed color;
  # Return replays it.
  - platform: template
    name: "Pool Lock"
    icon: "mdi:lock"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0d);'
  - platform: template
    name: "Pool Return"
    icon: "mdi:restore"
    on_press:
      then:
        - lambda: 'id(xg).send_effect_byte(0x0e);'
  # ─── Phase 4a probe (issue: arbitrary-RGB experiment) ────────
  # Sends whichever byte the `text.pool_probe_hex` field holds,
  # parsed as a hex string (with or without the `0x` prefix).
  # Used to walk the unmapped opcode space (0x0f..0xff) looking
  # for hidden palette entries, parameterised commands, or any
  # behaviour the official app doesn't expose. Watch
  # `text_sensor.pool_last_echo` for the controller's indication
  # echo, and watch the fixture for visible response.
  - platform: template
    name: "Pool Probe — Send Byte"
    icon: "mdi:flask-outline"
    on_press:
      then:
        - lambda: |-
            const std::string &s = id(pool_probe_hex).state;
            const char *p = s.c_str();
            if (s.size() >= 2 && p[0] == '0' &&
                (p[1] == 'x' || p[1] == 'X')) {
              p += 2;
            }
            char *end = nullptr;
            unsigned long v = std::strtoul(p, &end, 16);
            if (end == p) {
              ESP_LOGW("probe",
                       "could not parse '%s' as hex — skipping",
                       s.c_str());
              return;
            }
            if (v > 0xff) {
              ESP_LOGW("probe",
                       "value 0x%lx > 0xff, masking to low byte",
                       v);
              v &= 0xff;
            }
            id(xg).send_effect_byte((uint8_t) v);
  # Multi-byte raw probe. Sends whatever sequence
  # `text.pool_probe_bytes_hex` contains, parsed as a stream of
  # hex byte tokens (whitespace, commas, and per-token `0x`
  # prefixes are all optional; "ff 00 80", "ff,00,80" and
  # "ff0080" all produce {0xff, 0x00, 0x80}). Calls the
  # component's probe_write_raw() escape hatch which bypasses the
  # single-byte queue. Up to 20 bytes (BLE MTU 23 minus 3-byte
  # ATT Write Request header).
  - platform: template
    name: "Pool Probe — Send Bytes"
    icon: "mdi:flask-empty-plus-outline"
    on_press:
      then:
        - lambda: |-
            // Parse the user's hex stream into bytes. Strategy:
            // walk the string, skip non-hex separators, skip "0x"
            // / "0X" prefixes, then pair consecutive hex digits.
            // "ff 00 80", "0xff,0x00,0x80" and "ff0080" all yield
            // {0xff, 0x00, 0x80}.
            const std::string &s = id(pool_probe_bytes_hex).state;
            std::string digits;
            for (size_t i = 0; i < s.size(); i++) {
              char c = s[i];
              if (c == '0' && i + 1 < s.size() &&
                  (s[i+1] == 'x' || s[i+1] == 'X')) {
                i++;  // skip the 'x'/'X' too
                continue;
              }
              if (std::isxdigit((unsigned char) c)) {
                digits += c;
              }
            }
            std::vector<uint8_t> bytes;
            for (size_t j = 0; j < digits.size(); j += 2) {
              char pair[3] = {digits[j], 0, 0};
              if (j + 1 < digits.size()) {
                pair[1] = digits[j + 1];
              }
              bytes.push_back(
                  (uint8_t) std::strtoul(pair, nullptr, 16));
            }
            if (bytes.empty()) {
              ESP_LOGW("probe",
                       "no parseable hex bytes in '%s'", s.c_str());
              return;
            }
            id(xg).probe_write_raw(bytes);

# ─── Phase 4a probe input ────────────────────────────────────────
# Hex string for the byte to probe. Accepts "0f", "0x0f", "FF",
# etc. — case-insensitive, optional `0x` prefix. ESPHome's
# `number:` platform only exposes a float input which made the
# user mentally translate decimal↔hex; a text field keeps the
# value in the same base as the rest of the protocol notes.
text:
  - platform: template
    name: "Pool Probe Byte (hex)"
    id: pool_probe_hex
    initial_value: "0f"
    mode: text
    optimistic: true
    restore_value: false
    min_length: 1
    max_length: 4
  # Multi-byte raw probe input. Up to ~20 bytes (BLE MTU 23 minus
  # the 3-byte ATT Write Request header). Free-form: spaces,
  # commas, and per-token `0x` prefixes are all optional. Default
  # `08 00 00` writes Parisian Blue (0x08) plus two zero bytes —
  # if the controller is strict-1-byte it'll just play Parisian
  # Blue; if it accepts parameterised commands we'll know from
  # the visible result diverging.
  - platform: template
    name: "Pool Probe Bytes (hex)"
    id: pool_probe_bytes_hex
    initial_value: "08 00 00"
    mode: text
    optimistic: true
    restore_value: false
    min_length: 1
    max_length: 80

# Watchdog surface for HA (#12). The binary_sensor mirrors the BLE
# client's connected() state so HA can flag a disconnected fixture
# in automations / dashboards; the text_sensor exposes the most
# recent BLE error so the user has immediate feedback without
# having to open the ESPHome logs.
binary_sensor:
  - platform: template
    name: "Pool BLE Connected"
    id: pool_ble_connected
    device_class: connectivity
    lambda: 'return id(xg).connected();'

text_sensor:
  - platform: template
    name: "Pool Last BLE Error"
    id: pool_last_ble_error
    update_interval: 15s
    lambda: 'return id(xg).last_error();'
  - platform: template
    name: "Pool Last Command"
    id: pool_last_command
    update_interval: 15s
    lambda: 'return id(xg).last_command_name();'
  # Phase 4a probe: surfaces the controller's most recent
  # indication echo — the authoritative "command accepted" signal
  # per PROTOCOL.md §Controller-to-central indications. Useful for
  # confirming whether an unmapped byte is silently dropped vs.
  # acknowledged, independent of any visible fixture response.
  - platform: template
    name: "Pool Last Echo"
    id: pool_last_echo
    update_interval: 5s
    lambda: |-
      auto e = id(xg).last_echoed_byte();
      if (!e.has_value()) return std::string("(none)");
      char buf[16];
      std::snprintf(buf, sizeof(buf), "0x%02x", *e);
      return std::string(buf);

# Numeric diagnostics (#13). RSSI is polled every 30 s while
# connected; the two counters are monotonic-within-session totals
# that reset on reboot.
sensor:
  - platform: template
    name: "Pool BLE RSSI"
    id: pool_ble_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int8_t v = id(xg).last_rssi();
      if (v == 0) return NAN;  // 0 = not yet queried / disconnected
      return (float) v;
  - platform: template
    name: "Pool Command Count"
    id: pool_command_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_commands();'
  - platform: template
    name: "Pool Error Count"
    id: pool_error_count
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(xg).total_errors();'

# ─── Phase 4b PoC — show-scrub primitive ─────────────────────────
# Triggered by the `pool_scrub` HA service defined under api.services
# above. Sends a start byte, waits, then sends Lock (0x0d). Caller
# manages from-state normalization (typically: send Standby, wait
# ~3 s, then call this).
script:
  - id: pool_scrub_seq
    parameters:
      start_byte: int
      wait_ms: int
    then:
      - lambda: |-
          ESP_LOGI("scrub",
                   "start: byte=0x%02x wait_ms=%d",
                   (uint8_t) start_byte, wait_ms);
          id(xg).send_effect_byte((uint8_t) start_byte);
      - delay: !lambda 'return wait_ms;'
      - lambda: |-
          ESP_LOGI("scrub", "lock fire");
          id(xg).send_effect_byte(0x0d);  // Lock
